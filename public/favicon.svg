<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="#f2f2f7"/>
  <!-- iOS 3 Dots Bullet Card -->
  <rect x="80" y="80" width="352" height="352" rx="40" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Row 1 Red -->
  <circle cx="150" cy="165" r="22" fill="#FF3B30"/>
  <rect x="200" y="153" width="180" height="24" rx="12" fill="#E5E5EA"/>
  <!-- Row 2 Blue -->
  <circle cx="150" cy="256" r="22" fill="#007AFF"/>
  <rect x="200" y="244" width="180" height="24" rx="12" fill="#007AFF"/>
  <!-- Row 3 Orange -->
  <circle cx="150" cy="347" r="22" fill="#FF9500"/>
  <rect x="200" y="335" width="180" height="24" rx="12" fill="#E5E5EA"/>
</svg>